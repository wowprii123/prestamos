services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: prestamos
      POSTGRES_PASSWORD: prestamos
      POSTGRES_DB: prestamos
    ports:
      - "5432:5432"
    volumes:
      - prestamos_db_data:/var/lib/postgresql/data

volumes:
  prestamos_db_data:
